version: "3.9"
services:
  database:
    image: postgres:14
    container_name: va_database
    ports:
      - "5432:5432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: user
      POSTGRES_DB: videodb
    restart: always
    volumes:
      - "./pg:/var/lib/postgresql/data"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: va_server
    ports:
      - "5001:5001"
    env_file:
      - ./server/.env
    environment:
      PORT: 5001
    volumes:
      # MEDIA_ROOT is provided by start.sh (read from the MEDIAPATH file). The folder
      # must contain "videos" and "images" subdirectories.
      - "${MEDIA_ROOT:?MEDIA_ROOT is not set — run ./start.sh, which reads it from the MEDIAPATH file}/videos:/app/videos"
      - "${MEDIA_ROOT:?MEDIA_ROOT is not set — run ./start.sh, which reads it from the MEDIAPATH file}/images:/app/images"
      # Auth password, mounted read-only at runtime so it stays out of the image.
      # The server reads /app/PASSWORD at startup; if this file is absent, auth is
      # disabled. Create ./PASSWORD in the repo root before running ./start.sh.
      - "./PASSWORD:/app/PASSWORD:ro"
    restart: always
    depends_on:
      - database

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    container_name: va_client
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - server
